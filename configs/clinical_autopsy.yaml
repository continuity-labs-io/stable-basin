experiment_name: "Clinical Autopsy (Pharmacological Shock)"
models:
  - "masr_mamba"
  - "zero_padded_ssm"
  - "causal_transformer"
  - "masr_ssm"
data:
  condition: "50uM"
  seq_len: 2000
  input_dim: 1024
training:
  epochs: 15
  d_model: 256
  lr: 0.001
  burn_in_frames: 500
evaluation:
  ksm_threshold: 0.85
  png_prefix: "clinical_autopsy_dashboard"
  csv_prefix: "clinical_autopsy_metrics"
