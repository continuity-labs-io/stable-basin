experiment_name: "Clinical Diagnostic (Pharmacological Shock)"
models:
  - "masr_mamba"
  - "zero_padded_ssm"
  - "causal_transformer"
  - "masr_ssm"
data:
  type: "pharmacological"
  data_dir: "data/ephys/pharmacological_shock"
  condition: "50uM" # Drug_2953 (Diazepam)
  seq_len: 2000
  input_dim: 1024
training:
  epochs: 15
  d_model: 256
  lr: 0.001
  burn_in_frames: 500
evaluation:
  ksm_threshold: 0.95
  png_prefix: "clinical_diagnostic_dashboard"
  csv_prefix: "clinical_diagnostic_metrics"
