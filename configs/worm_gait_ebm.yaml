dataset:
  batch_size: 2
  seq_len: 100
experiment:
  dt: 0.01
  seed: 42
graph:
  n_steps: 1
logging:
  wandb_project: worm_gait_ebm
model:
  hidden_dimensions: 128
  use_blanket_topology: false
observer:
  macro:
    d_active: 4
    d_external: 4
    d_internal: 4
    d_sensory: 4
    ebm_depth: 2
    ebm_hidden_size: 128
    n_steps: 1
    temperature: 1.0
  micro:
    d_active: 8
    d_external: 8
    d_internal: 8
    d_sensory: 6
    ebm_depth: 2
    ebm_hidden_size: 256
    n_steps: 1
    temperature: 1.0
optimization:
  early_stopping_patience: 4000
  learning_rate: 5.0e-05
  max_epochs: 100
  max_grad_norm: 0.1
  weight_decay: 0.0
