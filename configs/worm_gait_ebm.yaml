optimization:
  learning_rate: 0.0001
  weight_decay: 0.0
  max_grad_norm: 0.1
  max_epochs: 2000
  early_stopping_patience: 2000

model:
  hidden_dimensions: 128
  use_blanket_topology: false

logging:
  wandb_project: "worm_gait_ebm"

observer:
  micro:
    d_internal: 8
    d_sensory: 6
    d_active: 8
    d_external: 8
    ebm_depth: 2
    n_steps: 1
    temperature: 1.0
    ebm_hidden_size: 128
  macro:
    d_internal: 4
    d_sensory: 4
    d_active: 4
    d_external: 4
    ebm_hidden_size: 16
    ebm_depth: 2
    n_steps: 1
    temperature: 1.0

graph:
  n_steps: 1

dataset:
  seq_len: 100
  batch_size: 2

experiment:
  seed: 42
  dt: 0.01
