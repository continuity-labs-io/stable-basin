[project]
name = "stable-basin"
version = "0.1.0"
description = "Stable Basin"
dependencies = [
    "extro-torx",
    "jax",
    "jaxlib",
    "equinox",
    "optax",
    "rerun-sdk",
    "google-genai",
    "torchfix==0.6.0",
    "mne",
    "scikit-learn",
    "pingouin",
    "pytest-cov",
    "jaxtyping",
    "beartype",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E",  # pycodestyle (includes E501 for line length)
    "C4", # flake8-comprehensions
    "B",  # flake8-bugbear
    "TID", # flake8-tidy-imports
]
ignore = ["F401", "E501", "E402"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src.icebox" = { msg = "Do not import from the icebox. It contains deprecated/archived code." }
"icebox" = { msg = "Do not import from the icebox. It contains deprecated/archived code." }

[tool.ruff.lint.per-file-ignores]
"src/icebox/**" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
reportUnusedImport = false

[tool.coverage.run]
omit = ["src/demo/*", "src/harness/*"]
